<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PLEASE NO CHANGES BELOW THIS LINE (UNTIL I SAY SO) -->
  <script language="javascript" type="text/javascript" src="p5.min.js"></script>
  <script language="javascript" type="text/javascript" src="ryanNew.js"></script>
  <!-- OK, YOU CAN MAKE CHANGES BELOW THIS LINE AGAIN -->

  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #c0c0c0;
    }

    #poster-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center; /* Forces the poster to anchor to the top edge */
      z-index: 1;
      pointer-events: none;
    }
canvas {
  animation: panHero linear;
  animation-timeline: scroll();
  animation-range: 0vw 121vw;
  transform: translateY(0px);
}

@keyframes panHero {
  to { transform: translateY(60vw)); }
}
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      filter:saturation(1.2);
      width: 100% !important;
      height: 100% !important;
      z-index: 2;
      display: block;
    }
  </style>
</head>

<body>
  <img id="poster-fallback" src="Ryan_Presley_2026_.jpg" alt="Poster fallback">
</body>
</html>
